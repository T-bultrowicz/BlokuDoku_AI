[project]
name = "blokudokuai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.3",
    "opencv-python>=5.0.0.93",
    "pandas>=3.0.6",
    "pure-python-adb>=0.3.0.dev0",
    "ruff>=0.17.3",
]

# Pick torch build per machine:
#   uv sync --extra cpu     (no NVIDIA GPU)
#   uv sync --extra cu130   (NVIDIA GPU, driver supporting CUDA 13.0)
[project.scripts]
blokudoku = "main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Flat modules in src/ are installed (editable) as top-level modules,
# so `import blokudoku_lib` works from anywhere under `uv run`.
[tool.hatch.build.targets.wheel]
sources = ["src"]
only-include = ["src"]

[project.optional-dependencies]
cpu = ["torch>=2.14.1"]
cu130 = ["torch>=2.14.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff.lint.isort]
known-first-party = ["blokudoku_lib", "network_lib", "reference", "conftest"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu130" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "cu130" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
